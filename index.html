<!DOCTYPE html>
<html lang="hu">
<head>
<script>
(function(){var c="Sasgabor1959",s=sessionStorage.getItem("gos_auth");if(s!==c){var a=prompt("Jelszó szükséges:");if(a!==c){document.write("<div style=\"font-family:sans-serif;text-align:center;margin-top:20%\">Hozzáférés megtagadva.<\/div>");document.close();throw new Error("stop");}sessionStorage.setItem("gos_auth",c);}})();
</script>
<!--
  GÁBOR OS DASHBOARD — v4.1 (2026.07.17.). Rendszerprompt: v3.25.
  CSAK két szekció: (1) 7 napos trend, (2) következő 7 nap.
  ADATFORRÁSOK:
  • 7 napos trend: a Notion "📊 Napi mérések – Trend napló (standard)" oldal EGYETLEN
    táblájából, a meglévő proxyn át (GET blocks/children). Egy sor = egy nap, fix oszlopok.
    A dashboard az utolsó (max 7) nem-üres értékből számol irányt metrikánként.
    Ezt a táblát Claude tölti a napi feldolgozáskor; Gábornak nincs teendője.
  • Következő 7 nap: NEM élő Google Calendar API — a gabor-os rotációból generálva.
  Ha nincs friss adat, a meglévő idősor alapján akkor is mutat trendet; új adatnál frissül.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gábor OS – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f2ed;--bg2:#edeae3;--surface:#fff;--border:#e0dbd2;--text:#1a1714;--text2:#5a5248;--muted:#9a9088;--accent:#2d6a4f;--green:#40916c;--warn:#e07a00;--red:#c0392b;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;padding-bottom:40px;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
  .header h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;}
  .header-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg2);padding:5px 10px;border-radius:6px;}
  .main{max-width:720px;margin:0 auto;padding:20px 16px;}
  .loading{text-align:center;padding:50px 20px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .sec{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:26px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .r-l{display:flex;align-items:center;gap:10px;min-width:0;}
  .r-ico{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
  .r-name{font-size:13px;color:var(--text2);}
  .r-r{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .r-val{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);}
  .trend{font-family:'JetBrains Mono',monospace;font-size:12px;display:flex;align-items:center;gap:3px;min-width:82px;justify-content:flex-end;}
  .t-up{color:var(--green);}.t-down{color:var(--red);}.t-flat{color:var(--muted);}
  .arr{font-size:13px;}
  .day{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .day:last-child{border-bottom:none;}
  .day.today{background:#d8f3dc;}
  .d-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:64px;flex-shrink:0;line-height:1.5;}
  .d-date b{display:block;color:var(--text);font-size:12px;}
  .d-body{flex:1;min-width:0;}
  .d-main{font-size:13px;color:var(--text);font-weight:500;}
  .d-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .d-tag{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:4px;flex-shrink:0;background:var(--bg2);color:var(--muted);}
  .tag-ero{background:#d8f3dc;color:var(--accent);}
  .tag-ma{background:var(--accent);color:#fff;}
  .foot{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:26px;padding-top:14px;border-top:1px solid var(--border);line-height:1.7;}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fade{animation:fu .35s ease forwards;}
</style>
</head>
<body>
<div class="header">
  <h1>Gábor OS</h1>
  <div class="header-date" id="hdate">…</div>
</div>
<div class="main">
  <div class="loading" id="loading"><div class="spin"></div>Notion adatok betöltése…</div>
  <div id="dash" style="display:none">
    <div class="sec">📈 Elmúlt 7 nap – trend</div>
    <div class="card" id="trend"></div>
    <div class="sec">📅 Következő 7 nap</div>
    <div class="card" id="next7"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
const TREND_PAGE_ID='3a0a30954a7481a6b8f2f7aa230fe981'; // 📊 Napi mérések – Trend napló (standard)
const PROXY='https://notion-proxy.sasgabor-sg.workers.dev';
// Vész-fallback (csak ha a Notion nem elérhető) – az utolsó ismert nem-üres értékek.
const FALLBACK={hrv:29,pulzus:59,alvas:68,lepesek:6384,suly:93.75,zsiger:14,cukor:34,liszt:24,datum:'07.14.'};

const DOW=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const DOW_S=['V','H','K','Sze','Cs','P','Szo'];
const MON=['jan','febr','márc','ápr','máj','jún','júl','aug','szept','okt','nov','dec'];
const today=()=>{const d=new Date();return `${d.getFullYear()}. ${MON[d.getMonth()]} ${d.getDate()}., ${DOW[d.getDay()]}`;};

async function nf(ep){const r=await fetch(`${PROXY}/notion/${ep}`,{headers:{'Notion-Version':'2022-06-28','Content-Type':'application/json'}});if(!r.ok)throw new Error('Notion '+r.status);return r.json();}
async function getBlocks(id){const d=await nf(`blocks/${id}/children?page_size=100`);const top=d.results||[],out=[];for(const b of top){out.push(b);if(b.has_children){try{const c=await nf(`blocks/${b.id}/children?page_size=100`);out.push(...(c.results||[]));}catch(e){}}}return out;}
function txt(b){const t=b.type,c=b[t];if(!c)return '';if(t==='table_row'&&c.cells)return c.cells.map(cl=>cl.map(r=>r.plain_text||'').join('')).join(' | ');return (c.rich_text||c.text||[]).map(r=>r.plain_text||'').join('');}

// A standard idősor-tábla beolvasása: minden dátummal kezdődő sor egy nap.
const COLS=['datum','hrv','pulzus','alvas','lepesek','suly','zsiger','testzsir','izom','bmr','cukor','liszt'];
function num(s){if(!s)return null;const m=s.match(/-?\d+[.,]?\d*/);return m?parseFloat(m[0].replace(',','.')):null;}
function parseTrend(blocks){
  const rows=[];
  for(const b of blocks){
    const parts=txt(b).split('|').map(x=>x.trim());
    if(parts.length>=12 && /^\d{4}-\d{2}-\d{2}$/.test(parts[0])){
      const o={datum:parts[0]};
      for(let i=1;i<COLS.length;i++)o[COLS[i]]=num(parts[i]);
      rows.push(o);
    }
  }
  rows.sort((a,b)=>a.datum<b.datum?-1:1); // időrend (régi→új)
  return rows;
}
// metrikánként: utolsó max 7 nem-üres érték; irány = legrégebbi → legújabb azok közül
function trendOf(rows,key,goodUp){
  const vals=rows.map(r=>r[key]).filter(v=>v!=null);
  const win=vals.slice(-7);
  const cur=win.length?win[win.length-1]:(FALLBACK[key]??null);
  if(win.length<2)return {cur,html:'<span class="t-flat">– kevés adat</span>'};
  const d=win[win.length-1]-win[0], days=win.length;
  if(Math.abs(d)<1e-9)return {cur,html:`<span class="t-flat"><span class="arr">→</span> 0 · ${days} mérés</span>`};
  const up=d>0, good=(up===goodUp), cls=good?'t-up':'t-down', arr=up?'▲':'▼';
  const dd=Math.round(Math.abs(d)*100)/100;
  return {cur,html:`<span class="${cls}"><span class="arr">${arr}</span> ${up?'+':'−'}${dd} · ${days} mérés</span>`};
}
function fmt(v,suf){return v==null?'–':(v.toLocaleString('hu')+(suf||''));}

function renderTrend(rows){
  const M=[
    {ic:'❤️',n:'HRV (7n)',    k:'hrv',    up:true, suf:' → 45+'},
    {ic:'💓',n:'Ny. pulzus',  k:'pulzus', up:false,suf:' bpm'},
    {ic:'😴',n:'Alvás',       k:'alvas',  up:true, suf:'/100'},
    {ic:'👟',n:'Lépések',     k:'lepesek',up:true, suf:''},
    {ic:'⚖️',n:'Testsúly',    k:'suly',   up:false,suf:' kg'},
    {ic:'🔴',n:'Zsigeri zsír',k:'zsiger', up:false,suf:''},
    {ic:'🍬',n:'Cukor streak',k:'cukor',  up:true, suf:' nap'},
    {ic:'🌾',n:'Liszt streak',k:'liszt',  up:true, suf:' nap'},
  ];
  document.getElementById('trend').innerHTML=M.map(m=>{
    const t=trendOf(rows,m.k,m.up);
    return `<div class="row"><div class="r-l"><span class="r-ico">${m.ic}</span><span class="r-name">${m.n}</span></div><div class="r-r"><span class="r-val">${fmt(t.cur,m.suf)}</span><span class="trend">${t.html}</span></div></div>`;
  }).join('');
}

// Következő 7 nap: gabor-os "Naptár-sablonok" rotációból generálva
const TPL={
  1:{t:'🧘 Könnyű nap + iroda 3×',tag:'',sub:'Meditáció + jóga + nyújtás · ⚡10/14/16:30'},
  2:{t:'💪 Erő A edzés (30–40p)',tag:'ero',sub:'Bicepsz · fekvőtámasz · guggolás · plank'},
  3:{t:'🧘 Könnyű nap + iroda 3×',tag:'',sub:'Meditáció + Thai chi + nyújtás · ⚡10/14/16:30'},
  4:{t:'💪 Erő B edzés (30–40p)',tag:'ero',sub:'Bolgár guggolás · superman · csípőhíd · oxi'},
  5:{t:'🧘 Könnyű nap + iroda 3×',tag:'',sub:'Meditáció + jóga + nyújtás · ⚡10/14/16:30'},
  6:{t:'🚶 Hosszú séta + szauna nap',tag:'',sub:'4–5 km + Thai chi',extra:'🗓️ 09:00 Heti tervezés'},
  0:{t:'😴 Pihenő nap',tag:'',sub:'Meditáció + könnyű nyújtás',extra:'📝 21:00 Heti értékelés'}
};
function renderNext7(){
  const base=new Date();base.setHours(0,0,0,0);let html='';
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);const dow=d.getDay();const p=TPL[dow];
    const isToday=i===0;
    const tag=isToday?'<span class="d-tag tag-ma">MA</span>':(p.tag==='ero'?'<span class="d-tag tag-ero">ERŐ</span>':'');
    html+=`<div class="day${isToday?' today':''}"><div class="d-date"><b>${DOW_S[dow]}</b>${d.getMonth()+1}.${d.getDate()}.</div><div class="d-body"><div class="d-main">${p.t}</div><div class="d-sub">${p.sub}${p.extra?' · '+p.extra:''}</div></div>${tag}</div>`;
  }
  document.getElementById('next7').innerHTML=html;
}

async function load(){
  document.getElementById('hdate').textContent=today();
  let note='', rows=[];
  try{
    rows=parseTrend(await getBlocks(TREND_PAGE_ID));
    if(rows.length===0){renderTrend([]);note='📌 a trend-tábla nem olvasható – utolsó ismert értékek';}
    else{
      renderTrend(rows);
      const last=rows[rows.length-1].datum.slice(5).replace('-','.')+'.';
      note=`trend a Notion idősorból · ${rows.length} nap · utolsó adat: ${last}`;
    }
  }catch(e){renderTrend([]);note='📌 Notion API nem elérhető – utolsó ismert értékek';}
  renderNext7();
  document.getElementById('foot').innerHTML=
    `Frissítve: ${new Date().toLocaleTimeString('hu-HU')} · ${note}<br>`+
    `Következő 7 nap: gabor-os rotációból generálva (nem élő Calendar-API)`;
  document.getElementById('loading').style.display='none';
  const dash=document.getElementById('dash');dash.style.display='block';dash.classList.add('fade');
}
load();
</script>
</body>
</html>
